<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Genesis</title><style>
body{font-family:system-ui;background:#0d1727;color:#e8f2ff;margin:0;padding:18px}main{max-width:850px;margin:auto}h1{color:#8de5c0}.box{background:#192940;border-radius:14px;padding:16px;margin:12px 0}button{background:#64d5aa;color:#102034;border:0;border-radius:8px;padding:10px;margin:3px;font-weight:bold}button:disabled{opacity:.5}small{color:#afc1d6}li{margin:7px 0}#log{max-height:300px;overflow:auto}select{padding:8px} .stat{display:inline-block;margin:5px 15px 5px 0}
</style></head><body><main><h1>🌍 Project Genesis</h1><p>Eine kleine, selbstständig simulierte Zivilisation – mit Familien, Kindern, Entscheidungen und Geschichte.</p><section class="box"><div id="stats"></div><button id="toggle">▶ Start</button><button id="step">Ein Jahr</button><button id="save">Speichern</button><button id="reset">Neu beginnen</button><br><small>Die Zeit läuft nur, solange die Webseite geöffnet ist. Fortschritt wird auf diesem Gerät gespeichert.</small></section><section class="box"><h2>Bewohner</h2><div id="people"></div></section><section class="box"><h2>📜 Logbuch</h2><div id="log"></div></section></main><script>
const first=['Mira','Noah','Lina','Elias','Sofia','Finn','Amira','Leo','Juna','Ben','Ada','Emil','Nora','Luca','Mila','Theo','Ella','Omar','Zoe','Paul','Tara','Kian','Rosa','Nico'];
const traits=['neugierig','mutig','friedlich','erfinderisch','hilfsbereit','vorsichtig'];
const rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)];
let state, timer=null;
function init(){state={year:1,next:21,people:Array.from({length:20},(_,i)=>({id:i+1,name:first[i],age:18+rand(23),trait:pick(traits),partner:null,parents:[],alive:true})),events:[]};log('20 Menschen gründen ihre Siedlung.');render()}
function log(s){state.events.unshift('Jahr '+state.year+': '+s);state.events=state.events.slice(0,160)}
function living(){return state.people.filter(p=>p.alive)}
function tick(){state.year++;for(const p of [...living()]){p.age++;if(p.age>62&&Math.random()<Math.min(.85,(p.age-61)*.027)){p.alive=false;log(p.name+' ist im Alter von '+p.age+' Jahren gestorben.')}else if(Math.random()<.12)log(p.name+' ('+p.age+') handelt '+(p.trait==='erfinderisch'?'erfinderisch und baut ein Werkzeug':p.trait==='friedlich'?'friedlich und schlichtet einen Streit':p.trait==='neugierig'?'neugierig und erkundet die Umgebung':p.trait==='hilfsbereit'?'hilfsbereit und unterstützt die Gemeinschaft':p.trait==='mutig'?'mutig und wagt ein Abenteuer':'vorsichtig und legt Vorräte an')+'.')}
const adults=living().filter(p=>p.age>=18&&p.age<=48&&!p.partner);for(const a of adults){if(a.partner||Math.random()>.065)continue;const options=adults.filter(b=>b.id!==a.id&&!b.partner&&!a.parents.includes(b.id)&&!b.parents.includes(a.id)&&!a.parents.some(id=>b.parents.includes(id)));if(options.length){let b=pick(options);a.partner=b.id;b.partner=a.id;log(a.name+' und '+b.name+' gründen eine Familie.')}}
for(const a of living().filter(p=>p.partner&&p.age>=18&&p.age<=42)){const b=state.people.find(x=>x.id===a.partner);if(!b?.alive||b.age>48||a.id>b.id||Math.random()>.13||living().length>=120)continue;const child={id:state.next++,name:pick(first)+' '+state.next,age:0,trait:Math.random()<.6?pick([a.trait,b.trait]):pick(traits),partner:null,parents:[a.id,b.id],alive:true};state.people.push(child);log(a.name+' und '+b.name+' bekommen ein Kind: '+child.name+'.')}
if(living().length===0)log('Die Zivilisation ist ausgestorben.');save();render()}
function save(){try{localStorage.setItem('genesis-v1',JSON.stringify(state))}catch(e){}}
function render(){document.getElementById('stats').innerHTML='<span class="stat">📅 Jahr: <b>'+state.year+'</b></span><span class="stat">👥 Lebende: <b>'+living().length+'</b></span><span class="stat">👶 Geburten: <b>'+(state.next-21)+'</b></span>';document.getElementById('people').innerHTML=living().map(p=>'<div>• '+p.name+' – '+p.age+' Jahre, '+p.trait+(p.partner?' ❤️':'')+'</div>').join('')||'Keine Überlebenden';document.getElementById('log').innerHTML=state.events.map(e=>'<div style="padding:5px 0;border-bottom:1px solid #304159">'+e+'</div>').join('');document.getElementById('toggle').textContent=timer?'⏸ Pause':'▶ Start'}
document.getElementById('toggle').onclick=()=>{if(timer){clearInterval(timer);timer=null}else timer=setInterval(tick,1800);render()};document.getElementById('step').onclick=tick;document.getElementById('save').onclick=()=>{save();alert('Auf diesem Gerät gespeichert!')};document.getElementById('reset').onclick=()=>{if(confirm('Simulation wirklich neu beginnen?')){if(timer)clearInterval(timer);timer=null;init();save()}};try{state=JSON.parse(localStorage.getItem('genesis-v1'))}catch(e){}if(!state?.people)init();else render();
</script></body></html>
